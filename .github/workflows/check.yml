# Runs on pull requests and on pushes to dev and ci/**: the unit tests, the
# scan for things that must not be in a public repository, and the browser
# tests in four slices. It has no secrets and can change nothing.
name: check
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, "ci/**"]
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/scan.mjs --patterns-only

  browser:
    # Pin the Intel image for all four browser shards (issue #8).
    runs-on: macos-15-intel
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - run: npm ci --ignore-scripts
      - name: Make sure Google Chrome is there
        run: |
          CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          if [ -x "$CHROME" ]; then
            "$CHROME" --version
          else
            echo "Google Chrome is not on this runner: installing it."
            npx playwright install chrome
          fi
      - name: Browser tests, slice ${{ matrix.shard }} of 4
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/log"
          export MAT_SHOTS="$RUNNER_TEMP/mat-shots"
          status=0
          node tests/e2e/run.cjs --shard ${{ matrix.shard }}/4 2>&1 | tee "$RUNNER_TEMP/log/e2e-${{ matrix.shard }}.log" || status=$?
          # A case that failed and then passed is a fault here, not a pass.
          if grep -q '^second try: ' "$RUNNER_TEMP/log/e2e-${{ matrix.shard }}.log"; then
            echo "These cases failed once and passed on the second try:"
            grep '^second try: ' "$RUNNER_TEMP/log/e2e-${{ matrix.shard }}.log"
            status=1
          fi
          exit $status
      - name: Keep the failure screenshots and the log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/mat-shots
            ${{ runner.temp }}/log
          if-no-files-found: ignore
          retention-days: 7

  # One name that is green only when every slice is: make this the required check.
  browser-all:
    needs: [browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every slice must have passed
        run: |
          echo "browser: ${{ needs.browser.result }}"
          [ "${{ needs.browser.result }}" = "success" ]
